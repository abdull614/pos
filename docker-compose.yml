version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pos_db
    restart: always
    environment:
      MYSQL_DATABASE: pos_db
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  trends-service:
    build: ./trends-service
    container_name: pos_python
    restart: always
    ports:
      - "5000:5000"

  admin:
    build: ./admin
    container_name: pos_admin
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./admin:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=pos_db
      - DB_USERNAME=root
      - DB_PASSWORD=secretpassword
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: pos_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./admin:/var/www/html
      - ./admin/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - admin

volumes:
  db_data:
